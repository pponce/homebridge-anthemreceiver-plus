name: Build, Test and Package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        homebridge: ['^1.8.0', '^2.0.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Switch to npm ci once the first dependency lockfile is generated and reviewed.
      - run: npm install --ignore-scripts
      - run: npm install --no-save --ignore-scripts 'homebridge@${{ matrix.homebridge }}'
      - run: npm run lint
      - run: npm test
      - name: Verify Homebridge package migration
        id: migration
        run: npm run test:migration
      - name: "Migration result: ${{ steps.migration.outputs.diagnostic || 'completed' }}"
        if: always() && steps.migration.outcome == 'failure'
        run: echo 'See migration test output and annotations for details.'
      - run: npm run check:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verify installed archive with production dependencies
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          destination=$(mktemp -d)
          npm install --prefix "$destination" --omit=dev --ignore-scripts "$PWD/$archive" 'homebridge@${{ matrix.homebridge }}'
          node -e 'require(process.argv[1])' "$destination/node_modules/homebridge-anthemreceiver-plus"
  git-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install this commit directly from GitHub with lifecycle scripts enabled
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          destination=$(mktemp -d)
          npm install --prefix "$destination" --omit=dev "$SOURCE_REPOSITORY#$SOURCE_SHA" 'homebridge@^1.8.0'
          node - "$destination/node_modules/homebridge-anthemreceiver-plus" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');
          const root = process.argv[2];
          assert.equal(typeof require(root), 'function');
          for (const file of ['dist/AnthemController.js', 'dist/ui-test.js', 'dist/config.js', 'homebridge-ui/server.js', 'homebridge-ui/public/index.html', 'homebridge-ui/public/app.js', 'homebridge-ui/public/model.js', 'homebridge-ui/public/style.css']) {
            assert.ok(fs.existsSync(path.join(root, file)), `Missing installed file: ${file}`);
          }
          const fromPlugin = createRequire(path.join(root, 'package.json'));
          fromPlugin.resolve('@homebridge/plugin-ui-utils');
          require(path.join(root, 'dist/ui-test.js'));
          console.log('Clean GitHub install generated dist and included the UI and its runtime dependency.');
          NODE
  github-release:
    needs: [test, git-install]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Publish the validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          [[ "$(git log -1 --format=%s)" == "release: $tag" ]]
          [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          [[ -s RELEASE_NOTES.md ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" == "$GITHUB_SHA" ]]
            echo "GitHub release $tag already exists for this commit."
          else
            if existing_tag=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>release-tag-error.log); then
              [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" == "$GITHUB_SHA" ]]
            else
              grep -q 'HTTP 404' release-tag-error.log
            fi
            gh release create "$tag" --target "$GITHUB_SHA" --latest \
              --title "Anthem Receiver Plus $version" --notes-file RELEASE_NOTES.md
          fi
